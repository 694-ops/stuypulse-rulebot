name: Update rules

# Checks frcmanual.com every 6 hours and commits a new rules.json when the
# manual changes: Team Updates during the season, and the new season's manual
# after kickoff. Vercel redeploys the bot from each commit to main.
# To check right away (on kickoff day, say), open Actions > Update rules > Run workflow.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write # commit rules.json
  actions: write # keep this schedule switched on

concurrency: update-rules

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rebuild rules.json from frcmanual.com
        id: rules
        run: node scripts/update-rules.mjs

      - name: Commit the new rules
        if: steps.rules.outputs.message != ''
        env:
          MESSAGE: ${{ steps.rules.outputs.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules.json
          git commit -m "$MESSAGE"
          git push

      # GitHub pauses scheduled workflows in public repos after 60 days without
      # repository activity, which would happen every offseason. Re-enabling the
      # workflow on each run keeps it running until the next kickoff.
      - name: Keep the schedule switched on
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/update-rules.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
